<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крути Карен!</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --common: #808080;
      --rare: #1e3c72;
      --super: #ffd700;
      --secret: #9b59b6;
      --currency: #c0c0c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    #auth-screen, #player-auth, #admin-auth, #game, #admin-panel {
      display: none;
    }
    .screen {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      z-index: 1000;
    }
    input, button, select {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    input {
      background: #222;
      color: #fff;
      border: 2px solid #333;
      width: 280px;
      text-align: center;
    }
    button {
      background: #1e3c72;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { background: #444; cursor: not-allowed; }

    .container { max-width: 950px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 28px; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 25px;
      background: #1a1a1a;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 15px 0;
      font-size: 17px;
      flex-wrap: wrap;
    }
    .currency { color: var(--currency); font-weight: bold; }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab-btn { background: #222; padding: 10px 20px; }
    .tab-btn.active { background: #1e3c72; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .spin-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .spin-controls button {
      padding: 8px 18px;
      background: #333;
    }
    .spin-controls button.active {
      background: #1e3c72;
    }

    .roulettes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 130px;
      background: #1a1a1a;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }
    .pointer {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 100%;
      background: #ff3333;
      z-index: 10;
      box-shadow: 0 0 12px #ff3333;
    }
    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0; top: 10px;
      height: 110px;
      will-change: transform;
    }
    .slot-card {
      width: 90px; height: 110px;
      margin: 0 5px;
      background: #252525;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 5px solid #fff;
    }
    .slot-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }

    .spin-btn {
      display: block;
      margin: 20px auto;
      padding: 16px 50px;
      font-size: 20px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 12px;
    }

    .bg-common { border-bottom-color: var(--common) !important; }
    .bg-rare { border-bottom-color: var(--rare) !important; }
    .bg-super { border-bottom-color: var(--super) !important; }
    .bg-secret { border-bottom-color: var(--secret) !important; }

    .inventory-grid, .market-grid, .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 2px solid #333;
      position: relative;
    }
    .card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    .card .name { font-size: 13px; margin: 8px 0 4px; font-weight: bold; }
    .card .count {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,0,0,0.75);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 12px;
      color: #ffd700;
    }
    .card button {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 13px;
      width: 100%;
    }
    .sell-btn { background: #c0392b; }
    .buy-btn { background: #27ae60; }

    /* Админка */
    #admin-panel {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .admin-section {
      background: #1a0a0a;
      border: 2px solid #ff5555;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .admin-section h3 { color: #ff5555; margin-bottom: 12px; }
    .admin-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .online-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .online { background: #2ecc71; }
    .offline { background: #777; }

    /* Модалки */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content {
      background: #222;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      border: 3px solid #fff;
      max-width: 360px;
      width: 90%;
    }
    .modal-content img { width: 160px; height: 160px; object-fit: cover; border-radius: 12px; }

    .trade-modal .modal-content { max-width: 500px; text-align: left; }
  </style>
</head>
<body>

  <!-- 1. Общий пароль -->
  <div id="auth-screen" class="screen" style="display:flex">
    <h2 style="color:#ffd700">Крути Карен!</h2>
    <input type="password" id="main-pass" placeholder="Пароль чести" autofocus>
    <button onclick="checkMainPassword()">Войти</button>
  </div>

  <!-- 2. Вход игрока -->
  <div id="player-auth" class="screen">
    <h2>Вход / Регистрация игрока</h2>
    <input type="text" id="player-login" placeholder="Логин">
    <input type="password" id="player-password" placeholder="Пароль">
    <button onclick="playerLogin()">Войти</button>
    <button onclick="playerRegister()" style="background:#27ae60">Создать аккаунт</button>
    <button onclick="backToMain()" style="background:#555;margin-top:10px">Назад</button>
  </div>

  <!-- 3. Вход админа -->
  <div id="admin-auth" class="screen">
    <h2 style="color:#ff5555">Вход администратора</h2>
    <input type="text" id="admin-login" placeholder="Логин админа">
    <input type="password" id="admin-password" placeholder="Пароль">
    <button onclick="adminLogin()">Войти</button>
    <button onclick="adminRegister()" style="background:#27ae60">Зарегистрировать админа</button>
    <button onclick="backToMain()" style="background:#555;margin-top:10px">Назад</button>
  </div>

  <!-- Игровая часть -->
  <div class="container" id="game">
    <div class="header">
      <h1>Крути Карен!</h1>
      <div style="color:#888;font-size:14px" id="current-login"></div>
    </div>

    <div class="stats">
      <div>🎰 Спины: <span id="balance-val">0</span></div>
      <div class="currency">C <span id="money-val">0</span></div>
      <div>📦 <span id="col-val">0 / 0</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('spin')">Крутить</button>
      <button class="tab-btn" onclick="switchTab('market')">Рынок</button>
      <button class="tab-btn" onclick="switchTab('inventory')">Инвентарь</button>
      <button class="tab-btn" onclick="switchTab('trade')">Трейд</button>
    </div>

    <!-- Крутить -->
    <div id="tab-spin" class="tab-content active">
      <div class="spin-controls">
        <button class="mult-btn active" data-mult="1">x1</button>
        <button class="mult-btn" data-mult="3">x3</button>
        <button class="mult-btn" data-mult="5">x5</button>
      </div>
      <div class="roulettes" id="roulettes"></div>
      <button class="spin-btn" id="spin-btn" onclick="startSpin()">ИСПЫТАТЬ ЧЕСТЬ</button>
    </div>

    <!-- Рынок -->
    <div id="tab-market" class="tab-content">
      <h2>Рынок</h2>
      <div style="margin:15px 0; padding:12px; background:#1a1a1a; border-radius:10px;">
        <strong>Купить крутки:</strong> 25 C за 1 штуку
        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
          <input type="number" id="buy-spins-amount" value="1" min="1" style="width:100px">
          <button class="buy-btn" onclick="buySpins()">Купить</button>
        </div>
      </div>
      <div class="market-grid" id="market-grid"></div>
    </div>

    <!-- Инвентарь -->
    <div id="tab-inventory" class="tab-content">
      <h2>Твой Инвентарь</h2>
      <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <!-- Трейд -->
    <div id="tab-trade" class="tab-content">
      <h2>Игроки онлайн</h2>
      <div id="players-list"></div>
    </div>
  </div>

  <!-- Админ панель -->
  <div id="admin-panel">
    <h1 style="color:#ff5555; text-align:center; margin-bottom:20px;">Панель Главврача</h1>
    <div style="text-align:center; margin-bottom:20px;">
      <button onclick="adminLogout()" style="background:#c0392b">Выйти</button>
    </div>

    <div class="admin-section">
      <h3>Игроки</h3>
      <div id="admin-players-list">Загрузка...</div>
    </div>

    <div class="admin-section">
      <h3>Выдать / Забрать</h3>
      <div class="admin-row">
        <input type="text" id="admin-target-login" placeholder="Логин игрока" style="width:180px">
        <select id="admin-karen"></select>
        <button onclick="adminGiveKaren()">Выдать карена</button>
        <button onclick="adminTakeKaren()" style="background:#c0392b">Забрать карена</button>
      </div>
      <div class="admin-row">
        <input type="number" id="admin-money" placeholder="Сумма C" style="width:140px">
        <button onclick="adminGiveMoney()">Выдать деньги</button>
        <button onclick="adminTakeMoney()" style="background:#c0392b">Забрать деньги</button>
      </div>
      <div class="admin-row">
        <input type="number" id="admin-spins" placeholder="Крутки" style="width:140px">
        <button onclick="adminGiveSpins()">Выдать крутки</button>
        <button onclick="adminTakeSpins()" style="background:#c0392b">Забрать крутки</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Риг (шансы) на игрока</h3>
      <div class="admin-row">
        <input type="text" id="rig-login" placeholder="Логин игрока" style="width:180px">
        <label><input type="checkbox" id="rig-common" checked> Common</label>
        <label><input type="checkbox" id="rig-rare" checked> Rare</label>
        <label><input type="checkbox" id="rig-super" checked> Super</label>
        <label><input type="checkbox" id="rig-secret" checked> Secret</label>
        <button onclick="adminApplyRig()">Применить</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Бан</h3>
      <div class="admin-row">
        <input type="text" id="ban-login" placeholder="Логин игрока" style="width:180px">
        <input type="text" id="ban-reason" placeholder="Причина" style="width:200px">
        <button onclick="adminBanAccount()" style="background:#c0392b">Бан аккаунта</button>
        <button onclick="adminUnban()" style="background:#27ae60">Разбан</button>
      </div>
    </div>
  </div>

  <!-- Модалка выигрыша -->
  <div id="win-modal" class="modal" onclick="closeModal()">
    <div class="modal-content" id="modal-content">
      <h2 id="win-tier">ВЫПАЛ!</h2>
      <div id="win-images"></div>
      <h3 id="win-name"></h3>
      <p style="color:#888;font-size:13px">Кликни чтобы закрыть</p>
    </div>
  </div>

<script>
  // ================== SUPABASE ==================
  const SUPABASE_URL = 'https://mcxyrqxxfrkeuigokrov.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_6rP-D6v4qFu0G8klWa-BzQ_mRTCtEH1';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ================== ДАННЫЕ ==================
  const KARENS = [
    { id: 'common_karen', name: 'Обычный Карен', tier: 'common', img: 'https://i.yapx.ru/eS6WDb.jpg' },
    { id: 'alparen', name: 'Карен-альпарен', tier: 'common', img: 'https://i.yapx.ru/eS6WKb.jpg' },
    { id: 'kamren', name: 'Камрен', tier: 'common', img: 'https://i.yapx.ru/eUrRTb.jpg' },
    { id: 'alkaren', name: 'Алкарен', tier: 'common', img: 'https://i.yapx.ru/eUrSRb.jpg' },
    { id: 'pechkaren', name: 'Печкарен', tier: 'common', img: 'https://i.yapx.ru/eUrS4b.jpg' },
    { id: 'oboroteren', name: 'Оборотерен', tier: 'common', img: 'https://via.placeholder.com/150?text=Оборотерен' },

    { id: 'karamelka', name: 'Каренка карамелька', tier: 'rare', img: 'https://i.yapx.ru/eS6V1b.jpg' },
    { id: 'boxren', name: 'Боксрен', tier: 'rare', img: 'https://i.yapx.ru/eS6VJb.jpg' },
    { id: 'vedmren', name: 'Ведьмрен', tier: 'rare', img: 'https://i.yapx.ru/eUrTEb.jpg' },
    { id: 'skibidren', name: 'Скибидирен', tier: 'rare', img: 'https://i.yapx.ru/eUrTwb.jpg' },
    { id: 'tykvaren', name: 'Тыкварен', tier: 'rare', img: 'https://i.yapx.ru/eUrUUb.jpg' },
    { id: 'harchoren', name: 'Харчорен', tier: 'rare', img: 'https://via.placeholder.com/150?text=Харчорен' },

    { id: 'dobren', name: 'Добрен', tier: 'super', img: 'https://i.yapx.ru/eS6U4b.jpg' },
    { id: 'zloren', name: 'Злорен', tier: 'super', img: 'https://i.yapx.ru/eS6Uvb.jpg' },
    { id: 'zmeikarenych', name: 'Змей Кареныч', tier: 'super', img: 'https://i.yapx.ru/eUrU7b.jpg' },
    { id: 'tachkaren', name: 'Тачкарен', tier: 'super', img: 'https://via.placeholder.com/150?text=Тачкарен' },
    { id: 'sigmaren', name: 'Сигмарен', tier: 'super', img: 'https://via.placeholder.com/150?text=Сигмарен' },

    { id: 'golden_karen', name: 'Golden Karen', tier: 'secret', img: 'https://i.yapx.ru/eS6Vib.jpg' },
    { id: 'primeren', name: 'Праймрен', tier: 'secret', img: 'https://i.yapx.ru/eUrWHb.jpg' },
    { id: 'karkaren', name: 'Каркарен', tier: 'secret', img: 'https://via.placeholder.com/150?text=Каркарен' }
  ];

  const SELL_PRICE = { common: 10, rare: 50, super: 500, secret: 100000 };
  const BUY_PRICE  = { common: 15, rare: 75, super: 750, secret: 150000 };

  let currentUser = null;      // игрок
  let currentAdmin = null;     // админ
  let inventory = {};
  let spinMultiplier = 1;
  let fingerprint = localStorage.getItem('karen_fp') || Math.random().toString(36).slice(2);
  localStorage.setItem('karen_fp', fingerprint);

  // ================== ВХОД ==================
  function checkMainPassword() {
    const pass = document.getElementById('main-pass').value;
    if (pass === 'karen2026') {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('player-auth').style.display = 'flex';
    } else if (pass === 'admren24546_1234') {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('admin-auth').style.display = 'flex';
    } else {
      alert('Неверный пароль чести!');
    }
  }

  function backToMain() {
    document.getElementById('player-auth').style.display = 'none';
    document.getElementById('admin-auth').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }

  // ========== ИГРОКИ ==========
  async function playerRegister() {
    const login = document.getElementById('player-login').value.trim();
    const password = document.getElementById('player-password').value;
    if (!login || !password) return alert('Заполни логин и пароль');

    const { data: existing } = await supabase.from('players').select('id').eq('login', login).maybeSingle();
    if (existing) return alert('Такой логин уже занят');

    const { data, error } = await supabase.from('players').insert({
      login, password, spins: 50, money: 0
    }).select().single();

    if (error) return alert('Ошибка: ' + error.message);
    alert('Аккаунт создан! Теперь войди.');
  }

  async function playerLogin() {
    const login = document.getElementById('player-login').value.trim();
    const password = document.getElementById('player-password').value;

    const { data, error } = await supabase.from('players')
      .select('*')
      .eq('login', login)
      .eq('password', password)
      .maybeSingle();

    if (error || !data) return alert('Неверный логин или пароль');
    if (data.is_banned) return alert('Аккаунт заблокирован: ' + (data.ban_reason || ''));

    // Проверка бана по IP/отпечатку
    const ip = 'unknown'; // в реальности можно получать через сервис
    const { data: bans } = await supabase.from('bans')
      .select('*')
      .or(`ip.eq.${ip},fingerprint.eq.${fingerprint}`);

    if (bans && bans.length) return alert('Доступ запрещён');

    currentUser = data;
    await supabase.from('players').update({
      last_online: new Date().toISOString(),
      fingerprint
    }).eq('id', currentUser.id);

    document.getElementById('player-auth').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    document.getElementById('current-login').innerText = 'Аккаунт: ' + currentUser.login;

    await loadInventory();
    updateUI();
    buildRoulettes();
    renderMarket();
    startOnlineHeartbeat();
  }

  // ========== АДМИНЫ ==========
  async function adminRegister() {
    const login = document.getElementById('admin-login').value.trim();
    const password = document.getElementById('admin-password').value;
    if (!login || !password) return alert('Заполни данные');

    const { data: existing } = await supabase.from('admins').select('id').eq('login', login).maybeSingle();
    if (existing) return alert('Такой логин уже есть');

    const { error } = await supabase.from('admins').insert({ login, password });
    if (error) return alert('Ошибка: ' + error.message);
    alert('Админ создан! Теперь войди.');
  }

  async function adminLogin() {
    const login = document.getElementById('admin-login').value.trim();
    const password = document.getElementById('admin-password').value;

    const { data, error } = await supabase.from('admins')
      .select('*')
      .eq('login', login)
      .eq('password', password)
      .maybeSingle();

    if (error || !data) return alert('Неверный логин или пароль');

    currentAdmin = data;
    document.getElementById('admin-auth').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    fillAdminSelect();
    loadAdminPlayers();
  }

  function adminLogout() {
    currentAdmin = null;
    document.getElementById('admin-panel').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }

  // ========== UI ==========
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');

    if (tab === 'inventory') renderInventory();
    if (tab === 'market') renderMarket();
    if (tab === 'trade') loadPlayersForTrade();
  }

  function updateUI() {
    document.getElementById('balance-val').innerText = currentUser.spins;
    document.getElementById('money-val').innerText = currentUser.money.toLocaleString();
    const unique = Object.keys(inventory).filter(id => inventory[id] > 0).length;
    document.getElementById('col-val').innerText = unique + ' / ' + KARENS.length;
  }

  // ========== ИНВЕНТАРЬ ==========
  async function loadInventory() {
    const { data } = await supabase.from('inventory')
      .select('*')
      .eq('player_id', currentUser.id);

    inventory = {};
    (data || []).forEach(item => {
      inventory[item.karen_id] = item.amount;
    });
  }

  async function saveInventoryItem(karenId, amount) {
    if (amount <= 0) {
      await supabase.from('inventory').delete()
        .eq('player_id', currentUser.id)
        .eq('karen_id', karenId);
      delete inventory[karenId];
    } else {
      await supabase.from('inventory').upsert({
        player_id: currentUser.id,
        karen_id: karenId,
        amount
      }, { onConflict: 'player_id,karen_id' });
      inventory[karenId] = amount;
    }
  }

  // ========== РУЛЕТКА ==========
  document.querySelectorAll('.mult-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      spinMultiplier = parseInt(btn.dataset.mult);
      buildRoulettes();
    });
  });

  function buildRoulettes() {
    const container = document.getElementById('roulettes');
    container.innerHTML = '';
    for (let i = 0; i < spinMultiplier; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'roulette-wrapper';
      wrapper.innerHTML = `<div class="pointer"></div><div class="roulette-tape" id="tape-${i}"></div>`;
      container.appendChild(wrapper);
      buildTape(i);
    }
  }

  function buildTape(index) {
    const tape = document.getElementById(`tape-${index}`);
    tape.style.transition = 'none';
    tape.style.transform = 'translateX(0)';
    tape.innerHTML = '';
    for (let i = 0; i < 45; i++) {
      const k = KARENS[Math.floor(Math.random() * KARENS.length)];
      tape.appendChild(createSlotCard(k));
    }
  }

  function createSlotCard(karen) {
    const div = document.createElement('div');
    div.className = 'slot-card bg-' + karen.tier;
    div.innerHTML = `<img src="${karen.img}" alt="">`;
    return div;
  }

  function rollKaren(rig) {
    let pool = KARENS.filter(k => rig['rig_' + k.tier]);
    if (pool.length === 0) pool = KARENS;

    const rand = Math.random() * 100;
    if (rand < 0.3 && pool.some(k => k.tier === 'secret')) {
      const secrets = pool.filter(k => k.tier === 'secret');
      return secrets[Math.floor(Math.random() * secrets.length)];
    }
    if (rand < 3 && pool.some(k => k.tier === 'super')) {
      const supers = pool.filter(k => k.tier === 'super');
      return supers[Math.floor(Math.random() * supers.length)];
    }
    if (rand < 35 && pool.some(k => k.tier === 'rare')) {
      const rares = pool.filter(k => k.tier === 'rare');
      return rares[Math.floor(Math.random() * rares.length)];
    }
    const commons = pool.filter(k => k.tier === 'common');
    return commons[Math.floor(Math.random() * commons.length)] || pool[0];
  }

  async function startSpin() {
    if (currentUser.spins < spinMultiplier) return alert('Недостаточно круток!');
    
    currentUser.spins -= spinMultiplier;
    await supabase.from('players').update({ spins: currentUser.spins }).eq('id', currentUser.id);
    updateUI();

    document.getElementById('spin-btn').disabled = true;
    const prizes = [];

    const rig = {
      rig_common: currentUser.rig_common,
      rig_rare: currentUser.rig_rare,
      rig_super: currentUser.rig_super,
      rig_secret: currentUser.rig_secret
    };

    for (let i = 0; i < spinMultiplier; i++) {
      const prize = rollKaren(rig);
      prizes.push(prize);
      const tape = document.getElementById(`tape-${i}`);
      buildTape(i);
      const prizeIndex = 32;
      if (tape.children[prizeIndex]) {
        tape.replaceChild(createSlotCard(prize), tape.children[prizeIndex]);
      }

      setTimeout(() => {
        tape.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.25, 1)';
        const cardWidth = 100;
        const wrapperWidth = tape.parentElement.offsetWidth;
        tape.style.transform = `translateX(${-(prizeIndex * cardWidth) + (wrapperWidth / 2) - 50}px)`;
      }, 50);
    }

    setTimeout(async () => {
      for (const prize of prizes) {
        const newAmount = (inventory[prize.id] || 0) + 1;
        await saveInventoryItem(prize.id, newAmount);
      }
      showWinModal(prizes);
      document.getElementById('spin-btn').disabled = false;
      updateUI();
    }, 4200);
  }

  function showWinModal(prizes) {
    const names = prizes.map(p => p.name).join(', ');
    document.getElementById('win-tier').innerText = prizes.length > 1 ? `ВЫПАЛО x${prizes.length}` : prizes[0].tier.toUpperCase();
    document.getElementById('win-name').innerText = names;
    const imagesDiv = document.getElementById('win-images');
    imagesDiv.innerHTML = prizes.map(p => `<img src="${p.img}" style="width:90px;height:90px;margin:4px;border-radius:8px">`).join('');
    document.getElementById('win-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('win-modal').style.display = 'none';
  }

  // ========== РЫНОК & ИНВЕНТАРЬ ==========
  function renderMarket() {
    const grid = document.getElementById('market-grid');
    grid.innerHTML = '';
    KARENS.forEach(k => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${k.img}">
        <div class="name">${k.name}</div>
        <div style="color:var(--currency);font-size:13px">${BUY_PRICE[k.tier]} C</div>
        <button class="buy-btn" onclick="buyKaren('${k.id}')">Купить</button>
      `;
      grid.appendChild(card);
    });
  }

  async function buyKaren(id) {
    const karen = KARENS.find(k => k.id === id);
    const price = BUY_PRICE[karen.tier];
    if (currentUser.money < price) return alert('Недостаточно C!');

    currentUser.money -= price;
    await supabase.from('players').update({ money: currentUser.money }).eq('id', currentUser.id);
    const newAmount = (inventory[id] || 0) + 1;
    await saveInventoryItem(id, newAmount);
    updateUI();
    alert('Куплено!');
  }

  async function buySpins() {
    const amount = parseInt(document.getElementById('buy-spins-amount').value) || 1;
    const cost = amount * 25;
    if (currentUser.money < cost) return alert('Недостаточно C!');

    currentUser.money -= cost;
    currentUser.spins += amount;
    await supabase.from('players').update({
      money: currentUser.money,
      spins: currentUser.spins
    }).eq('id', currentUser.id);
    updateUI();
    alert(`Куплено ${amount} круток!`);
  }

  function renderInventory() {
    const grid = document.getElementById('inventory-grid');
    grid.innerHTML = '';
    KARENS.forEach(k => {
      if (inventory[k.id] > 0) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="count">x${inventory[k.id]}</div>
          <img src="${k.img}">
          <div class="name">${k.name}</div>
          <div style="color:var(--currency);font-size:13px">${SELL_PRICE[k.tier]} C</div>
          <button class="sell-btn" onclick="sellKaren('${k.id}')">Продать</button>
        `;
        grid.appendChild(card);
      }
    });
  }

  async function sellKaren(id) {
    if (!inventory[id] || inventory[id] <= 0) return;
    const karen = KARENS.find(k => k.id === id);
    inventory[id]--;
    currentUser.money += SELL_PRICE[karen.tier];
    await saveInventoryItem(id, inventory[id]);
    await supabase.from('players').update({ money: currentUser.money }).eq('id', currentUser.id);
    updateUI();
    renderInventory();
  }

  // ========== ТРЕЙД (базовая версия) ==========
  async function loadPlayersForTrade() {
    const { data } = await supabase.from('players')
      .select('id, login, last_online')
      .neq('id', currentUser.id)
      .order('last_online', { ascending: false });

    const list = document.getElementById('players-list');
    list.innerHTML = '';

    (data || []).forEach(p => {
      const isOnline = (new Date() - new Date(p.last_online)) < 60000; // 1 минута
      const div = document.createElement('div');
      div.className = 'player-row';
      div.innerHTML = `
        <div>
          <span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>
          ${p.login}
        </div>
        <button onclick="alert('Трейд с ${p.login} — в следующей версии будет полноценный интерфейс')">Предложить трейд</button>
      `;
      list.appendChild(div);
    });
  }

  function startOnlineHeartbeat() {
    setInterval(async () => {
      if (currentUser) {
        await supabase.from('players').update({
          last_online: new Date().toISOString()
        }).eq('id', currentUser.id);
      }
    }, 30000);
  }

  // ========== АДМИНКА ==========
  function fillAdminSelect() {
    const select = document.getElementById('admin-karen');
    select.innerHTML = '';
    KARENS.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k.id;
      opt.textContent = `${k.name} (${k.tier})`;
      select.appendChild(opt);
    });
  }

  async function loadAdminPlayers() {
    const { data } = await supabase.from('players')
      .select('*')
      .order('last_online', { ascending: false });

    const container = document.getElementById('admin-players-list');
    container.innerHTML = '';

    (data || []).forEach(p => {
      const isOnline = (new Date() - new Date(p.last_online)) < 60000;
      const div = document.createElement('div');
      div.className = 'player-row';
      div.innerHTML = `
        <div>
          <span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>
          <strong>${p.login}</strong> — 
          🎰 ${p.spins} | C ${p.money} 
          ${p.is_banned ? '<span style="color:#ff5555">[БАН]</span>' : ''}
        </div>
      `;
      container.appendChild(div);
    });
  }

  async function getPlayerByLogin(login) {
    const { data } = await supabase.from('players').select('*').eq('login', login).maybeSingle();
    return data;
  }

  async function adminGiveKaren() {
    const login = document.getElementById('admin-target-login').value.trim();
    const karenId = document.getElementById('admin-karen').value;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    const { data: inv } = await supabase.from('inventory')
      .select('*')
      .eq('player_id', player.id)
      .eq('karen_id', karenId)
      .maybeSingle();

    const amount = (inv?.amount || 0) + 1;
    await supabase.from('inventory').upsert({
      player_id: player.id,
      karen_id: karenId,
      amount
    }, { onConflict: 'player_id,karen_id' });

    alert('Карен выдан!');
    loadAdminPlayers();
  }

  async function adminTakeKaren() {
    const login = document.getElementById('admin-target-login').value.trim();
    const karenId = document.getElementById('admin-karen').value;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    const { data: inv } = await supabase.from('inventory')
      .select('*')
      .eq('player_id', player.id)
      .eq('karen_id', karenId)
      .maybeSingle();

    if (!inv || inv.amount <= 0) return alert('У игрока нет этого карена');

    const amount = inv.amount - 1;
    if (amount <= 0) {
      await supabase.from('inventory').delete().eq('id', inv.id);
    } else {
      await supabase.from('inventory').update({ amount }).eq('id', inv.id);
    }
    alert('Карен забран!');
  }

  async function adminGiveMoney() {
    const login = document.getElementById('admin-target-login').value.trim();
    const amount = parseInt(document.getElementById('admin-money').value);
    if (!amount) return;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({ money: player.money + amount }).eq('id', player.id);
    alert('Деньги выданы!');
    loadAdminPlayers();
  }

  async function adminTakeMoney() {
    const login = document.getElementById('admin-target-login').value.trim();
    const amount = parseInt(document.getElementById('admin-money').value);
    if (!amount) return;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({ money: Math.max(0, player.money - amount) }).eq('id', player.id);
    alert('Деньги забраны!');
    loadAdminPlayers();
  }

  async function adminGiveSpins() {
    const login = document.getElementById('admin-target-login').value.trim();
    const amount = parseInt(document.getElementById('admin-spins').value);
    if (!amount) return;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({ spins: player.spins + amount }).eq('id', player.id);
    alert('Крутки выданы!');
    loadAdminPlayers();
  }

  async function adminTakeSpins() {
    const login = document.getElementById('admin-target-login').value.trim();
    const amount = parseInt(document.getElementById('admin-spins').value);
    if (!amount) return;
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({ spins: Math.max(0, player.spins - amount) }).eq('id', player.id);
    alert('Крутки забраны!');
    loadAdminPlayers();
  }

  async function adminApplyRig() {
    const login = document.getElementById('rig-login').value.trim();
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({
      rig_common: document.getElementById('rig-common').checked,
      rig_rare: document.getElementById('rig-rare').checked,
      rig_super: document.getElementById('rig-super').checked,
      rig_secret: document.getElementById('rig-secret').checked
    }).eq('id', player.id);

    alert('Риг применён!');
  }

  async function adminBanAccount() {
    const login = document.getElementById('ban-login').value.trim();
    const reason = document.getElementById('ban-reason').value.trim();
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({
      is_banned: true,
      ban_reason: reason || 'Без причины'
    }).eq('id', player.id);

    alert('Игрок забанен!');
    loadAdminPlayers();
  }

  async function adminUnban() {
    const login = document.getElementById('ban-login').value.trim();
    const player = await getPlayerByLogin(login);
    if (!player) return alert('Игрок не найден');

    await supabase.from('players').update({
      is_banned: false,
      ban_reason: null
    }).eq('id', player.id);

    alert('Игрок разбанен!');
    loadAdminPlayers();
  }
</script>
